spring.application.name=asset-service

server.port=8081

# PostgreSQL
spring.datasource.url=${ASSET_DB_URL:jdbc:postgresql://localhost:5432/assetdb}
spring.datasource.username=${ASSET_DB_USER}
spring.datasource.password=${ASSET_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info