name: CloudMaint CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read
  packages: write


env:
  REGISTRY: ghcr.io


jobs:

  # LINT
  lint:

    name: Code and Dockerfile lint
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Java - asset-service
      - name: Checkstyle asset-service
        working-directory: asset-service
        run: >
          ./mvnw -B -DskipTests
          org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check
          -Dcheckstyle.config.location=../.github/checkstyle.xml

      # Java - incident-service
      - name: Checkstyle incident-service
        working-directory: incident-service
        run: >
          ./mvnw -B -DskipTests
          org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check
          -Dcheckstyle.config.location=../.github/checkstyle.xml

      # Dockerfiles
      - name: Hadolint asset-service Dockerfile
        run: >
          docker run --rm -i
          hadolint/hadolint:latest-alpine
          --ignore DL3059 -
          < asset-service/Dockerfile

      - name: Hadolint incident-service Dockerfile
        run: >
          docker run --rm -i
          hadolint/hadolint:latest-alpine
          --ignore DL3059 -
          < incident-service/Dockerfile

      # Compose syntax
      - name: Validate compose.yaml
        run: |
          cp .env.example .env
          docker compose config


  # Asset service tests
  asset-tests:

    name: Asset Service Tests
    runs-on: ubuntu-latest

    services:

      postgres:

        image: postgres:17-alpine

        env:
          POSTGRES_DB: assetdb
          POSTGRES_USER: cloudmaint
          POSTGRES_PASSWORD: cloudmaint_ci

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U cloudmaint -d assetdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: asset-service/pom.xml

      - name: Run asset-service tests
        working-directory: asset-service

        env:
          ASSET_DB_URL: jdbc:postgresql://localhost:5432/assetdb
          ASSET_DB_USER: cloudmaint
          ASSET_DB_PASSWORD: cloudmaint_ci

        run: ./mvnw -B test


  # Incident service tests
  incident-tests:

    name: Incident Service Tests
    runs-on: ubuntu-latest

    services:

      postgres:

        image: postgres:17-alpine

        env:
          POSTGRES_DB: incidentdb
          POSTGRES_USER: cloudmaint
          POSTGRES_PASSWORD: cloudmaint_ci

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U cloudmaint -d incidentdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:

        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: incident-service/pom.xml

      - name: Run incident-service tests
        working-directory: incident-service

        env:
          INCIDENT_DB_URL: jdbc:postgresql://localhost:5432/incidentdb
          INCIDENT_DB_USER: cloudmaint
          INCIDENT_DB_PASSWORD: cloudmaint_ci

          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379

        run: ./mvnw -B test


  # DOCKER BUILD + GHCR
  docker:

    name: Build and Publish Docker Images

    needs:
      - lint
      - asset-tests
      - incident-tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      # GHCR --> nombres en minúsculas
      - name: Normalize repository owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Solo autenticamos cuando estamos haciendo push a main
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        uses: docker/login-action@v4

        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # Asset service
      - name: Build and publish asset-service
        uses: docker/build-push-action@v7

        with:
          context: ./asset-service

          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

          tags: |
            ghcr.io/${{ env.OWNER_LC }}/cloudmaint-asset-service:sha-${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/cloudmaint-asset-service:latest

          cache-from: type=gha,scope=asset-service
          cache-to: type=gha,mode=max,scope=asset-service


      # Inicident service
      - name: Build and publish incident-service
        uses: docker/build-push-action@v7

        with:
          context: ./incident-service

          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

          tags: |
            ghcr.io/${{ env.OWNER_LC }}/cloudmaint-incident-service:sha-${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/cloudmaint-incident-service:latest

          cache-from: type=gha,scope=incident-service
          cache-to: type=gha,mode=max,scope=incident-service