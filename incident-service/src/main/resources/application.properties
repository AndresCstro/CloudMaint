spring.application.name=incident-service

server.port=8082

# PostgreSQL
spring.datasource.url=${INCIDENT_DB_URL:jdbc:postgresql://localhost:5433/incidentdb}
spring.datasource.username=${INCIDENT_DB_USER}
spring.datasource.password=${INCIDENT_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Asset Service
asset-service.url=${ASSET_SERVICE_URL:http://localhost:8081}

# Actuator
management.endpoints.web.exposure.include=health,info